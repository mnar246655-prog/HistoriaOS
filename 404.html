<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#183c35">
    <meta name="description" content="الصفحة التي تبحث عنها غير موجودة في HistoriaOS.">
    <meta name="robots" content="noindex,follow">
    <meta name="site-base-path" content="/HistoriaOS/">
    <title>404 | HistoriaOS</title>
    <style>
        :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; color: #23342e; background: #f7f6f0; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
        main { width: min(100%, 560px); padding: 40px; border: 1px solid #e4e0d4; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 18px 50px #183c3510; }
        .code { margin: 0; color: #a17b3d; font-size: 13px; font-weight: 700; letter-spacing: .16em; }
        h1 { margin: 12px 0; color: #183c35; font-size: clamp(24px, 6vw, 36px); }
        .message { margin: 0 0 26px; color: #63716a; line-height: 1.9; }
        a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px; color: #fff; background: #183c35; font-weight: 700; text-decoration: none; }
        a:hover { background: #28564b; }
        a:focus-visible { outline: 3px solid #c59b54; outline-offset: 3px; }
        @media (max-width: 480px) { main { padding: 30px 22px; } }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>هذه الصفحة غير موجودة</h1>
        <p class="message">ربما نُقل الرابط أو كُتب بطريقة غير صحيحة. يمكنك العودة إلى الموسوعة ومتابعة الاستكشاف.</p>
        <a id="home-link" href="website/">العودة إلى الرئيسية</a>
    </main>
    <script>
        const basePath = document.querySelector('meta[name="site-base-path"]').content;
        if (basePath) document.getElementById("home-link").href = `${basePath}website/`;
    </script>
</body>
</html>
